<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>인권 생활시 쓰기 | 천중마일리지</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    :root { --school-blue: #1a4b8c; --accent: #667eea; }
    body { background: #f4f6fb; min-height: 100vh; }
    .hero {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border-radius: 0 0 1rem 1rem;
    }
    .chat-box {
      height: min(52vh, 420px);
      overflow-y: auto;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 0.75rem;
      padding: 0.75rem;
    }
    .bubble {
      max-width: 92%;
      padding: 0.55rem 0.8rem;
      border-radius: 1rem;
      margin-bottom: 0.5rem;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.95rem;
    }
    .bubble.bot { background: #eef1ff; color: #1f2937; border-bottom-left-radius: 0.25rem; }
    .bubble.me { background: var(--accent); color: #fff; margin-left: auto; border-bottom-right-radius: 0.25rem; }
    .poem-area { min-height: 220px; font-size: 1.05rem; line-height: 1.7; }
    .hint { font-size: 0.85rem; color: #6b7280; }
  </style>
</head>
<body>
  <div class="hero p-3 p-md-4 mb-3 shadow-sm">
    <div class="container">
      <div class="d-flex justify-content-between align-items-start gap-2">
        <div>
          <h1 class="h4 fw-bold mb-1"><i class="bi bi-hearts"></i> 인권 생활시 쓰기</h1>
          <p class="mb-0 small opacity-75">존중·배려·공동체 생활도 인권이에요. 챗봇은 생각만 돕고, 시는 스스로 써요.</p>
        </div>
        <div class="text-end">
          <div class="fw-bold" id="whoLabel">학생</div>
          <button class="btn btn-sm btn-light mt-1" onclick="window.close()">닫기</button>
        </div>
      </div>
    </div>
  </div>

  <div class="container pb-5">
    <div id="noLogin" class="alert alert-warning" style="display:none;">
      메인에서 학생으로 로그인한 뒤 <b>인권 생활시 쓰기</b> 버튼을 다시 눌러 주세요. (이 창을 주소로 직접 열면 학생 정보가 없어요)
    </div>

    <div id="app" style="display:none;">
      <div class="row g-3">
        <div class="col-lg-6">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-header bg-white fw-bold">
              <i class="bi bi-chat-dots text-primary"></i> 촉진 챗봇
              <span class="hint ms-1">(대신 써 달라고 해도 거절해요)</span>
            </div>
            <div class="card-body">
              <div id="chatBox" class="chat-box mb-2"></div>
              <div class="input-group">
                <input type="text" id="chatInput" class="form-control" placeholder="생각·경험을 적어 보세요" maxlength="2000"
                  onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat();}" />
                <button class="btn btn-primary" id="btnSend" onclick="sendChat()">보내기</button>
              </div>
            </div>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-header bg-white fw-bold d-flex justify-content-between align-items-center">
              <span><i class="bi bi-pen text-danger"></i> 내 생활시</span>
              <span class="hint" id="statusLabel"></span>
            </div>
            <div class="card-body">
              <textarea id="poemInput" class="form-control poem-area mb-2" placeholder="여기에 시를 직접 써 주세요.&#10;&#10;예) 줄바꿈으로 행을 나눠도 좋아요."></textarea>
              <div class="hint mb-3">제출하면 시와 챗봇 대화 전체가 함께 저장됩니다. (심사 참고용)</div>
              <button class="btn w-100 fw-bold text-white" style="background:linear-gradient(to right,#667eea,#764ba2);" id="btnSubmit" onclick="submitPoem()">
                제출하기
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    var API_BASE = '/api';
    var student = null;
    var messages = [];

    async function apiCall(endpoint, body) {
      var resp = await fetch(API_BASE + endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      return resp.json();
    }

    function renderChat() {
      var box = document.getElementById('chatBox');
      box.innerHTML = messages.map(function (m) {
        var cls = m.role === 'assistant' ? 'bot' : 'me';
        var text = String(m.content || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return '<div class="bubble ' + cls + '">' + text + '</div>';
      }).join('');
      box.scrollTop = box.scrollHeight;
    }

    function addBubble(role, content) {
      messages.push({ role: role, content: content });
      renderChat();
    }

    var chatCooldownUntil = 0;

    async function sendChat() {
      var input = document.getElementById('chatInput');
      var text = (input.value || '').trim();
      if (!text) return;
      if (!student) return;
      var now = Date.now();
      if (now < chatCooldownUntil) {
        var sec = Math.ceil((chatCooldownUntil - now) / 1000);
        addBubble('assistant', '잠깐! ' + sec + '초만 기다렸다가 보내 주세요. (동시 접속 보호)');
        return;
      }
      input.value = '';
      document.getElementById('btnSend').disabled = true;
      addBubble('user', text);
      try {
        var r = await apiCall('/poem', {
          action: 'chat',
          studentId: student.id,
          messages: messages.slice(0, -1),
          message: text
        });
        if (!r.success) {
          addBubble('assistant', (r.msg || '응답 실패'));
          var wait = Number(r.waitMs) || 3000;
          chatCooldownUntil = Date.now() + wait;
        } else {
          if (Array.isArray(r.messages)) messages = r.messages;
          else addBubble('assistant', r.reply || '');
          renderChat();
          chatCooldownUntil = Date.now() + 3000;
        }
      } catch (e) {
        addBubble('assistant', '네트워크 오류: ' + e);
        chatCooldownUntil = Date.now() + 3000;
      }
      setTimeout(function () {
        document.getElementById('btnSend').disabled = false;
        input.focus();
      }, Math.max(500, chatCooldownUntil - Date.now()));
    }

    async function submitPoem() {
      if (!student) return;
      var poem = (document.getElementById('poemInput').value || '').trim();
      if (poem.length < 20) return alert('시는 최소 20자 이상 작성해 주세요.');
      var userTurns = messages.filter(function (m) { return m.role === 'user'; }).length;
      if (userTurns < 2) return alert('챗봇과 조금 더 대화한 뒤 제출해 주세요. (학생 메시지 2회 이상)');
      if (!confirm('시와 대화 내역을 함께 제출할까요?')) return;
      document.getElementById('btnSubmit').disabled = true;
      try {
        var r = await apiCall('/poem', {
          action: 'submit',
          studentId: student.id,
          studentName: student.name,
          poem: poem,
          chatLog: messages
        });
        alert(r.msg || (r.success ? '제출되었습니다.' : '실패'));
        if (r.success) document.getElementById('statusLabel').innerText = '제출 완료';
      } catch (e) {
        alert('제출 오류: ' + e);
      }
      document.getElementById('btnSubmit').disabled = false;
    }

    function readStudent() {
      try {
        var q = new URLSearchParams(location.search);
        var sid = (q.get('sid') || '').trim();
        var sname = (q.get('sname') || '').trim();
        if (sid) return { id: sid, name: sname };
      } catch (e) {}
      try {
        var fromSession = JSON.parse(sessionStorage.getItem('poem_student') || 'null');
        if (fromSession && fromSession.id) return fromSession;
      } catch (e) {}
      try {
        var fromLocal = JSON.parse(localStorage.getItem('poem_student') || 'null');
        if (fromLocal && fromLocal.id) return fromLocal;
      } catch (e) {}
      return null;
    }

    async function boot() {
      student = readStudent();
      if (student && student.id) {
        try {
          sessionStorage.setItem('poem_student', JSON.stringify(student));
          localStorage.setItem('poem_student', JSON.stringify(student));
        } catch (e) {}
      }
      if (!student || !student.id) {
        document.getElementById('noLogin').style.display = 'block';
        return;
      }
      document.getElementById('app').style.display = 'block';
      document.getElementById('whoLabel').innerText = (student.name || '') + ' (' + student.id + ')';

      addBubble('assistant',
        '안녕! 나는 인권 생활시 쓰기 도우미야.\n\n' +
        '인권은 억울한 일만 뜻하는 게 아니야. 함께 사는 공동체에서 서로를 존중하고, 배려하고, ' +
        '말을 조심히 듣고, 약속을 지키는 일상도 모두 인권과 이어져 있어.\n\n' +
        '시는 내가 대신 쓰지 않아. 네 생각을 꺼낼 수 있게 질문만 할게.\n\n' +
        '요즘 친구·가족·교실에서 "서로를 존중했다"거나 "함께 잘 지냈다"고 느낀 순간이 있어? ' +
        '아니면 존중·배려가 잘 보였던 장면을 하나 떠올려 볼래?'
      );

      try {
        var r = await apiCall('/poem', { action: 'mySubmission', studentId: student.id });
        if (r.success && r.submission) {
          document.getElementById('poemInput').value = r.submission.poem || '';
          if (Array.isArray(r.submission.chatLog) && r.submission.chatLog.length) {
            messages = r.submission.chatLog;
            renderChat();
          }
          document.getElementById('statusLabel').innerText = '이전 제출 불러옴 · 수정 후 다시 제출 가능';
        }
      } catch (e) {}
    }

    boot();
  </script>
</body>
</html>
