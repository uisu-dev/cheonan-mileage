<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>천안중학교 학부모 설문 (원스쿨로 이동)</title>
  <style>
    body { font-family: 'Noto Sans KR', system-ui, sans-serif; margin: 0; background: #f4f7fb; color: #1f2937; }
    main { max-width: 560px; margin: 12vh auto; background: #fff; border-radius: 16px; padding: 28px 24px; box-shadow: 0 6px 24px rgba(0,0,0,.06); text-align: center; }
    h1 { font-size: 1.25rem; margin: 0 0 12px; }
    p { line-height: 1.6; margin: 8px 0; }
    a.btn { display: inline-block; margin-top: 16px; padding: 12px 20px; border-radius: 10px; background: #0054a6; color: #fff; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>천안중학교 학부모 설문이 원스쿨로 옮겨졌어요</h1>
    <p>잠시 후 새 설문 페이지로 이동합니다. 이 기기에서 이미 제출한 응답은 새 페이지에서도 이어서 볼 수 있고 고칠 수 있어요.</p>
    <a class="btn" id="go" href="https://oneschool.co.kr/p/J9v24qwWAbDXpNfx">새 설문 페이지 열기</a>
  </main>
  <script>
    // 천중마일리지 학부모 설문의 기기 토큰을 새 주소의 # 뒤에 붙여 넘긴다(# 뒤는 서버로 전송되지 않음).
    (function () {
      var TARGET = 'https://oneschool.co.kr/p/J9v24qwWAbDXpNfx';
      var UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
      var url = TARGET;
      try {
        var t = localStorage.getItem('cheonan_parent_survey_device') || '';
        if (UUID_RE.test(t)) url = TARGET + '#dt=' + t.toLowerCase();
      } catch (e) {}
      document.getElementById('go').href = url;
      location.replace(url);
    })();
  </script>
</body>
</html>
